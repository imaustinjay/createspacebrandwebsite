# createspacebrand.com — the public marketing site.
#
# This repo IS the site: link it to Netlify with no base directory and
# everything (publish dir, functions, redirects, headers) is read from here.
# The workspace app (createspacebrand.online) lives in its own repo
# (imaustinjay/createspace-workspace) and deploys separately.
#
# Static multi-page site — nothing to compile. npm install runs automatically
# (package.json is here) so the enquiry function's dependencies get bundled.
[build]
  command = "echo 'static site — nothing to build'"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The brand enquiry form on /brands/.
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200

# The shop desk — contact, careers and workshop alerts, internship
# applications, the Fall Drop first-look list, account reservations, and the
# Collection Program's notify list when the workspace can't take it. One
# handler, one destination mailbox.
[[redirects]]
  from = "/api/shop"
  to = "/.netlify/functions/shop"
  status = 200

# Live season status for the application doors (reads the workspace's open
# casting cycles via the Supabase anon key; cached 5 minutes).
[[redirects]]
  from = "/api/seasons"
  to = "/.netlify/functions/seasons"
  status = 200

# The storefront's prices, read live from Stripe (cached 5 minutes at the CDN).
# Every price on the site is an em-dash until this answers, which is why a
# missing Stripe key shows no price rather than a wrong one.
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

# Cart in, a client secret out. The payment is then taken by Stripe's Payment
# Element mounted inside /shop/checkout/ — the buyer never leaves the site, and
# no card field exists in this repo. Amounts are resolved server-side from the
# price ids: the browser never names a price.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

# One order read back from Stripe, for the confirmation page — by Stripe's
# return parameters straight after paying, or by the receipt's permanent token
# any time after.
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200

# The door a receipt opens: the download token names what it bought, and
# nothing leaves storage without one.
[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

# The stockroom — uploading the digital products themselves. Behind
# ADMIN_TOKEN; closed entirely when that isn't set.
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

# The site's own foot traffic. One beacon per page view, from
# /assets/measure.js, answered with 204 and no body. Public by necessity —
# every visitor's browser calls it — and deliberately unable to read anything
# back out. What it writes is only ever readable through /api/insights.
[[redirects]]
  from = "/api/measure"
  to = "/.netlify/functions/measure"
  status = 200

# The portal's login: a passphrase, then a six-digit code mailed to the owner,
# then an HttpOnly session cookie. Kept apart from /api/insights so that one
# function decides who you are and the other assumes it has been decided.
[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

# Everything /admin/ shows: the visit counters, Search Console, a live crawl
# of our own pages, and the playbook built from all three. Behind the session
# cookie above; 401 without it.
[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

# Stripe's own callback — the side of the checkout that can be trusted, and
# therefore the side that fulfils. A rewrite (status 200) so the raw body
# arrives byte-for-byte: the signature is computed over it, and a redirect
# would break verification. This is the URL to register in the Stripe
# dashboard; /.netlify/functions/stripe-webhook works too.
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# The Collection Program's live state, proxied straight through to the
# workspace app, which owns the cycles, the seats and the notify list. A proxy
# (status 200), not a redirect: a 301 would drop the POST body the notify form
# sends, and same-origin keeps the page working regardless of CORS.
#
# The endpoint is public and thin — a state, the dates, both prices, and
# whether seats remain. It exposes nothing that isn't already on the page.
# Until the workspace ships its cohort release this proxies to a 404, which is
# exactly why /collection/ treats an unanswered read as "unknown", never as
# "closed", and why the notify form falls back to the shop desk.
[[redirects]]
  from = "/api/cohort-status"
  to = "https://createspacebrand.online/api/cohort-status"
  status = 200
  force = true

# The Cohort became The Collection Program, and moved out of the storefront to
# sit with the Community division it belongs to. The old address keeps working.
[[redirects]]
  from = "/shop/cohort/*"
  to = "/collection/"
  status = 301

# Fonts never change under a given filename — cache them hard.
#
# They're also readable cross-origin, which is not a leak (they're already
# public files) and is a requirement: the checkout hands this stylesheet to
# Stripe's Payment Element iframe so the card field is set in Raleway like
# everything around it. Without the header the iframe silently falls back to
# a system font, and the one part of the page that has to look trustworthy is
# the one part that looks borrowed.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Everything else under /assets revalidates on every visit. This used to be
# split into /assets/*.css and /assets/*.js revalidation rules over a
# day-long /assets/* default — but Netlify header patterns only support a
# trailing splat, so the .css/.js rules never matched and stylesheets fell
# through to the day-long cache. That paired the 2026-08-09 header rework's
# new HTML with day-old CSS on phones (the 2026-07-30 failure again, one
# layer down). ETags keep the usual answer a 304, so revalidating images
# too costs almost nothing. The ?v= fingerprint on asset links is the
# second guard: bump it in the same change whenever CSS or JS changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The portal. The page already carries a noindex meta tag; this says the same
# thing in a header, which is the version a crawler sees before it parses any
# HTML — and the version that still applies to the JSON behind it.
#
# Deliberately NOT disallowed in robots.txt. A disallowed URL is never fetched,
# so the noindex is never read, and an unlinked-but-disallowed page can still
# end up listed from an external link with no description. Letting it be
# fetched and told not to index is the stronger of the two.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
