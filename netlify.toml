# createspacebrand.com — the public marketing site.
#
# This repo IS the site: link it to Netlify with no base directory and
# everything (publish dir, functions, redirects, headers) is read from here.
# The workspace app (createspacebrand.online) lives in its own repo
# (imaustinjay/createspace-workspace) and deploys separately.
#
# Static multi-page site — nothing to compile. npm install runs automatically
# (package.json is here) so the enquiry function's dependencies get bundled.
[build]
  command = "echo 'static site — nothing to build'"
  publish = "public"
  functions = "netlify/functions"
  # Netlify runs this before every build, on every context — production,
  # branch and deploy preview. Exit 0 and the build is skipped; exit 1 and it
  # proceeds. `git diff --quiet` does exactly that, and nothing else.
  #
  # There is no compile step here, but a build is never free: Netlify installs
  # the 57 packages in package-lock.json (55MB, because the functions need
  # Stripe and nodemailer) and esbuild bundles twenty functions, thirteen of
  # which carry the Stripe SDK. A commit that touches only the README, the
  # tests or product-art/ — the PNG masters that are never deployed — used to
  # pay all of that to publish a byte-identical site.
  #
  # The paths listed are everything a deploy is actually made of. Add to this
  # list, never trim it: a path left out is a change that silently never ships.
  # On a first build, or after the cache is cleared, CACHED_COMMIT_REF is empty
  # and git exits non-zero — which builds. That is the safe direction to fail.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public netlify netlify.toml package.json package-lock.json"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# The brand enquiry form on /brands/.
[[redirects]]
  from = "/api/enquiry"
  to = "/.netlify/functions/enquiry"
  status = 200

# The new client service inquiry on /inquire/ — also where the tap card
# (/card/) sends people. Same guards as the enquiry; destination
# INQUIRY_EMAIL, falling back to the house mailbox.
[[redirects]]
  from = "/api/inquiry"
  to = "/.netlify/functions/inquiry"
  status = 200

# The shop desk — contact, careers and workshop alerts, internship
# applications, the Fall Drop first-look list, and the Collection Program's
# notify list when the workspace can't take it. One handler, one destination
# mailbox.
[[redirects]]
  from = "/api/shop"
  to = "/.netlify/functions/shop"
  status = 200

# Live season status for the application doors (reads the workspace's open
# casting cycles via the Supabase anon key; cached 5 minutes).
[[redirects]]
  from = "/api/seasons"
  to = "/.netlify/functions/seasons"
  status = 200

# The storefront's prices, read live from Stripe (cached 5 minutes at the CDN).
# Every price on the site is an em-dash until this answers, which is why a
# missing Stripe key shows no price rather than a wrong one.
[[redirects]]
  from = "/api/catalog"
  to = "/.netlify/functions/catalog"
  status = 200

# Cart in, a client secret out. The payment is then taken by Stripe's Payment
# Element mounted inside /shop/checkout/ — the buyer never leaves the site, and
# no card field exists in this repo. Amounts are resolved server-side from the
# price ids: the browser never names a price.
[[redirects]]
  from = "/api/checkout"
  to = "/.netlify/functions/checkout"
  status = 200

# ── Done-for-you services ─────────────────────────────────────────────────
#
# The shelf sells two kinds of thing now. A product is files: you pay, you
# download, it is over in a second. A SERVICE is work: you pay, and a fortnight
# later a team hands you a brand. The three doors below are that second kind.
#
# /api/services       — the shelf with live Stripe prices, cached 5 minutes.
#                       Tier-04 services come back unpriced on purpose: the
#                       catalog's rule is that no payment link exists until the
#                       scope and the fee are agreed in writing.
# /api/service-checkout — one service, one payment (full fee or the 50%
#                       deposit, each its own Stripe price). Same Payment
#                       Element, same page, same refusal to trust a browser
#                       with an amount.
# /api/scope-request  — the other door, for the tier-04 services. Not a contact
#                       form: it opens a real engagement on the workspace desk
#                       and the client's assessment reaches them in a minute.
#
# What happens after the payment lives in netlify/shared/commission.mjs: a
# signed commission crosses to createspacebrand.online, which opens the
# engagement, seeds its documents and writes to the client. If the bridge is
# down the commission is HELD in a durable outbox and retried — a sale that
# does not reach the workspace is the worst failure this repo can have.
[[redirects]]
  from = "/api/services"
  to = "/.netlify/functions/services"
  status = 200

[[redirects]]
  from = "/api/service-checkout"
  to = "/.netlify/functions/service-checkout"
  status = 200

[[redirects]]
  from = "/api/scope-request"
  to = "/.netlify/functions/scope-request"
  status = 200

# One order read back from Stripe, for the confirmation page — by Stripe's
# return parameters straight after paying, or by the receipt's permanent token
# any time after.
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200

# The door a receipt opens: the download token names what it bought, and
# nothing leaves storage without one.
[[redirects]]
  from = "/api/download"
  to = "/.netlify/functions/download"
  status = 200

# The stockroom — uploading the digital products themselves. Behind
# ADMIN_TOKEN; closed entirely when that isn't set.
[[redirects]]
  from = "/api/products"
  to = "/.netlify/functions/products"
  status = 200

# The site's own foot traffic. One beacon per page view, from
# /assets/measure.js, answered with 204 and no body. Public by necessity —
# every visitor's browser calls it — and deliberately unable to read anything
# back out. What it writes is only ever readable through /api/insights.
[[redirects]]
  from = "/api/measure"
  to = "/.netlify/functions/measure"
  status = 200

# The customer door — create an account, log in, recover a password. Identity
# lives in Supabase Auth on the same project as the workspace, so it is one
# login for both; the session comes back in an HttpOnly cookie.
[[redirects]]
  from = "/api/account-auth"
  to = "/.netlify/functions/account-auth"
  status = 200

# Everything /account/ shows — purchases with their permanent download links,
# the craft membership, and any invoices raised to the signed-in address.
# Behind the account cookie; 401 without it, and nothing before the address
# is confirmed.
[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200

# "Manage billing" — opens a Stripe billing portal session for the signed-in
# customer. Card, invoices, cancellation all happen on Stripe's hosted page.
[[redirects]]
  from = "/api/account-billing"
  to = "/.netlify/functions/account-billing"
  status = 200

# The billing desk — the Billing tab of /admin/. Issues a brand's invoice
# (Stripe holds it, the house emails it, the balance banks it), reads the
# ledger back, resends, voids. Behind the portal session cookie; 401 bare.
[[redirects]]
  from = "/api/billing"
  to = "/.netlify/functions/billing"
  status = 200

# The portal's login: a passphrase, then a six-digit code mailed to the owner,
# then an HttpOnly session cookie. Kept apart from /api/insights so that one
# function decides who you are and the other assumes it has been decided.
[[redirects]]
  from = "/api/admin-auth"
  to = "/.netlify/functions/admin-auth"
  status = 200

# Everything /admin/ shows: the visit counters, Search Console, a live crawl
# of our own pages, and the playbook built from all three. Behind the session
# cookie above; 401 without it.
[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

# Stripe's own callback — the side of the checkout that can be trusted, and
# therefore the side that fulfils. A rewrite (status 200) so the raw body
# arrives byte-for-byte: the signature is computed over it, and a redirect
# would break verification. This is the URL to register in the Stripe
# dashboard; /.netlify/functions/stripe-webhook works too.
[[redirects]]
  from = "/api/stripe-webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200

# The Collection Program's live state, proxied straight through to the
# workspace app, which owns the cycles, the seats and the notify list. A proxy
# (status 200), not a redirect: a 301 would drop the POST body the notify form
# sends, and same-origin keeps the page working regardless of CORS.
#
# The endpoint is public and thin — a state, the dates, both prices, and
# whether seats remain. It exposes nothing that isn't already on the page.
# Until the workspace ships its cohort release this proxies to a 404, which is
# exactly why /collection/ treats an unanswered read as "unknown", never as
# "closed", and why the notify form falls back to the shop desk.
[[redirects]]
  from = "/api/cohort-status"
  to = "https://createspacebrand.online/api/cohort-status"
  status = 200
  force = true

# The Cohort became The Collection Program, and moved out of the storefront to
# sit with the Community division it belongs to. The old address keeps working.
[[redirects]]
  from = "/shop/cohort/*"
  to = "/collection/"
  status = 301

# A product added from the stockroom gets a page without a deploy.
#
# NOT forced, and that is the entire design. Netlify matches a static file
# before an unforced rewrite, so every hand-built product page —
# /shop/products/start-small/index.html and its six siblings — wins this rule
# outright and is served exactly as before. Only an id with no file of its own
# reaches the generated template, which fills itself from the shelf that
# /api/catalog carries.
#
# It also means a generated product can be promoted to a hand-built one at any
# time by adding its file. Nothing migrates and no rule changes: the file
# simply starts winning. An id that is on no shelf at all renders the
# template's own "not on the shelf" state rather than a 404, because by the
# time we know it is missing the page has already been served.
[[redirects]]
  from = "/shop/products/:id/"
  to = "/shop/products/generated/"
  status = 200

# Fonts never change under a given filename — cache them hard.
#
# They're also readable cross-origin, which is not a leak (they're already
# public files) and is a requirement: the checkout hands this stylesheet to
# Stripe's Payment Element iframe so the card field is set in Raleway like
# everything around it. Without the header the iframe silently falls back to
# a system font, and the one part of the page that has to look trustworthy is
# the one part that looks borrowed.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Product art never changes under a given filename either. Every shot is named
# for what it is and how wide it is — 01-cover-600.webp — and a re-shoot is a
# new name, not new bytes at the old one. So it earns the same treatment as
# the fonts, by the same mechanism: a trailing-splat rule under /assets/ that
# wins over the revalidate default below. It is 1.3MB across the shelf and
# ~112KB on a single product page, which is the heaviest thing a repeat
# visitor currently re-checks on every visit.
#
# This deliberately stops short of the CSS and JS. Those revalidate on purpose
# — see the note below — and no saving is worth the third occurrence of that
# particular failure.
[[headers]]
  for = "/assets/products/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else under /assets revalidates on every visit. This used to be
# split into /assets/*.css and /assets/*.js revalidation rules over a
# day-long /assets/* default — but Netlify header patterns only support a
# trailing splat, so the .css/.js rules never matched and stylesheets fell
# through to the day-long cache. That paired the 2026-08-09 header rework's
# new HTML with day-old CSS on phones (the 2026-07-30 failure again, one
# layer down). ETags keep the usual answer a 304, so revalidating images
# too costs almost nothing. The ?v= fingerprint on asset links is the
# second guard: bump it in the same change whenever CSS or JS changes.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The portal. The page already carries a noindex meta tag; this says the same
# thing in a header, which is the version a crawler sees before it parses any
# HTML — and the version that still applies to the JSON behind it.
#
# Deliberately NOT disallowed in robots.txt. A disallowed URL is never fetched,
# so the noindex is never read, and an unlinked-but-disallowed page can still
# end up listed from an external link with no description. Letting it be
# fetched and told not to index is the stronger of the two.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

# The customer portal — a signed-in page with nothing in it for a crawler,
# and nothing in it that should outlive the visit in a shared cache.
[[headers]]
  for = "/account/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
